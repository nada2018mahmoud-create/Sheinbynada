<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sheinbynada</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  --bg:#FBF3F1; --surface:#FFFFFF; --ink:#2E1B22; --muted:#7D6670; --line:#EBD6D6;
  --rose:#C93F67; --rose-ink:#FFFFFF; --blush:#F4DADD; --mocha:#8A5A44; --ok:#25A244;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#1D1317; --surface:#2A1D23; --ink:#F6E7E8; --muted:#BDA3AB; --line:#432F37;
    --rose:#E5698C; --rose-ink:#2A1018; --blush:#3A2630; --mocha:#D4A48C;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#1D1317; --surface:#2A1D23; --ink:#F6E7E8; --muted:#BDA3AB; --line:#432F37;
  --rose:#E5698C; --rose-ink:#2A1018; --blush:#3A2630; --mocha:#D4A48C;
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font-family:"Readex Pro","Segoe UI",Tahoma,Arial,sans-serif;line-height:1.7;-webkit-text-size-adjust:100%}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--rose);outline-offset:2px}
img{max-width:100%;display:block}

/* header */
.top{background:var(--blush);padding:28px 20px 18px}
.wrap{max-width:1080px;margin:0 auto}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-size:clamp(30px,8vw,54px);font-weight:700;letter-spacing:-.02em;line-height:1.1;direction:ltr;margin:0}
.brand span{color:var(--rose)}
.tag{margin:6px 0 0;color:var(--muted);font-size:15px;font-weight:300}
.cartbtn{position:relative;border:1.5px solid var(--ink);background:transparent;border-radius:999px;
  padding:9px 18px;font-weight:500;display:flex;gap:8px;align-items:center;white-space:nowrap}
.cartbtn .n{background:var(--rose);color:var(--rose-ink);border-radius:999px;min-width:24px;height:24px;
  display:inline-grid;place-items:center;font-size:13px;padding:0 6px}
.search{margin-top:18px}
.search input{width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;
  padding:12px 16px;font-size:16px}
.search input::placeholder{color:var(--muted)}

/* categories */
.cats{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);
  border-bottom:1px solid var(--line)}
.cats .wrap{display:flex;gap:8px;overflow-x:auto;padding:12px 20px;scrollbar-width:none}
.cats .wrap::-webkit-scrollbar{display:none}
.chip{flex:none;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 16px;
  font-size:15px;font-weight:400}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* grid */
main{padding:22px 20px 60px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:22px 14px}
@media (min-width:720px){.grid{grid-template-columns:repeat(3,1fr);gap:28px 20px}}
@media (min-width:1000px){.grid{grid-template-columns:repeat(4,1fr)}}
.card{display:flex;flex-direction:column}
.pic{aspect-ratio:4/5;border-radius:18px;overflow:hidden;background:var(--blush);position:relative}
.pic img{width:100%;height:100%;object-fit:cover}
.price{position:absolute;inset-inline-start:10px;bottom:10px;background:var(--surface);color:var(--ink);
  border-radius:999px;padding:3px 12px;font-weight:600;font-size:15px}
.name{margin:10px 2px 2px;font-size:15px;font-weight:500;line-height:1.5}
.desc{margin:0 2px 8px;color:var(--muted);font-size:13px;font-weight:300;line-height:1.6}
.opts{display:flex;flex-wrap:wrap;gap:6px;margin:0 2px 10px}
.opt{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:3px 11px;font-size:13px}
.opt[aria-pressed="true"]{border-color:var(--rose);background:var(--rose);color:var(--rose-ink)}
.add{margin-top:auto;border:0;background:var(--ink);color:var(--bg);border-radius:12px;padding:10px;font-weight:500}
.add.done{background:var(--ok);color:#fff}
.empty{text-align:center;padding:56px 10px;color:var(--muted)}
.empty a{color:var(--rose);font-weight:500}

footer{border-top:1px solid var(--line);padding:26px 20px 40px;color:var(--muted);font-size:14px}
footer a{color:var(--ink);font-weight:500;direction:ltr;unicode-bidi:embed}

/* cart drawer */
.veil{position:fixed;inset:0;background:rgba(20,8,12,.5);opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
.veil.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;z-index:21;inset-inline:0;bottom:0;margin:0 auto;max-width:560px;max-height:92%;overflow:auto;
  background:var(--surface);border-radius:24px 24px 0 0;padding:20px 20px calc(24px + env(safe-area-inset-bottom,0px));
  transform:translateY(105%);transition:transform .25s ease}
.sheet.on{transform:none}
.sheet h2{margin:0 0 12px;font-size:20px}
.close{position:absolute;inset-block-start:14px;inset-inline-end:16px;border:0;background:var(--blush);
  width:34px;height:34px;border-radius:50%;font-size:18px}
.line{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.line img{width:56px;height:70px;object-fit:cover;border-radius:10px}
.line .t{flex:1;font-size:14px;line-height:1.5}
.line .t small{display:block;color:var(--muted)}
.qty{display:flex;align-items:center;gap:8px}
.qty button{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--line);background:transparent;font-size:16px;line-height:1}
.total{display:flex;justify-content:space-between;font-weight:600;font-size:17px;margin:14px 0}
label{display:block;font-size:14px;margin:10px 0 4px;color:var(--muted)}
.field{width:100%;border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:11px 14px;font-size:16px}
textarea.field{min-height:76px;resize:vertical}
.send{width:100%;margin-top:16px;border:0;background:#1FA855;color:#fff;border-radius:14px;padding:14px;font-size:17px;font-weight:600}
.send[disabled]{opacity:.5}
.copy{width:100%;margin-top:10px;border:1.5px solid var(--ink);background:transparent;border-radius:14px;padding:11px;font-size:15px}
.copy[hidden]{display:none}
.left{margin:-4px 2px 8px;color:var(--rose);font-size:13px;font-weight:500}
.add[disabled]{opacity:.5;cursor:not-allowed}

.card[data-open]{cursor:pointer}
.add{width:100%}
.det{max-height:94%}
.dpic{aspect-ratio:4/5;max-height:44vh;border-radius:16px;overflow:hidden;background:var(--blush);margin:26px auto 12px}
.dpic img{width:100%;height:100%;object-fit:cover}
.dname{font-size:19px;font-weight:600;margin:0 0 2px;line-height:1.5}
.dprice{font-size:18px;font-weight:600;color:var(--rose);margin:0 0 6px}
.dlabel{font-size:14px;color:var(--muted);margin:12px 0 6px}
.stepper{display:flex;align-items:center;gap:14px}
.stepper button{width:42px;height:42px;border-radius:50%;border:1.5px solid var(--ink);background:transparent;font-size:22px;line-height:1}
.stepper button[disabled]{opacity:.35;cursor:not-allowed}
.stepper b{min-width:30px;text-align:center;font-size:18px}
.avail{font-size:13px;color:var(--muted);margin:6px 0 0}
.avail.warn{color:var(--rose)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field[aria-invalid="true"]{border-color:var(--rose);background:var(--blush)}
.cont{width:100%;margin:12px 0 0;border:1.5px solid var(--ink);background:transparent;border-radius:12px;padding:10px;font-size:15px}
.loading{grid-column:1/-1;text-align:center;color:var(--muted);padding:40px 0}
.note{font-size:13px;color:var(--muted);margin:8px 0 0}
.err{color:var(--rose);font-size:13px;margin:6px 0 0;min-height:1em}
@media (prefers-reduced-motion:reduce){.sheet,.veil{transition:none}}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="bar">
      <div>
        <h1 class="brand">Shein<span>by</span>nada</h1>
        <p class="tag">ميكب، شنط، هدوم وأكتر. اختاري واطلبي على واتساب</p>
      </div>
      <button class="cartbtn" id="openCart" aria-label="فتح السلة">السلة <span class="n" id="cnt">0</span></button>
    </div>
    <div class="search"><input id="q" type="search" placeholder="دوري على منتج..." aria-label="بحث"></div>
  </div>
</header>

<nav class="cats" aria-label="الأقسام"><div class="wrap" id="cats"></div></nav>

<main><div class="wrap"><div class="grid" id="grid"></div><div class="empty" id="empty" hidden></div></div></main>

<footer><div class="wrap">
  للطلب والاستفسار على واتساب:
  <a href="https://wa.me/201157190028">01157190028</a> أو
  <a href="https://wa.me/201027201844">01027201844</a>
</div></footer>

<div class="veil" id="veil"></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="سلة الطلبات">

  <div id="lines"></div>
  <div id="checkout">

    </div>
    <label for="st">اسم الشارع</label><input class="field" id="st" autocomplete="address-line1">
    <div class="row2">
      <div><label for="bld">رقم العمارة</label><input class="field" id="bld" inputmode="numeric"></div>
      <div><label for="apt">رقم الشقة</label><input class="field" id="apt" inputmode="numeric"></div>
    </div>
    <label for="ad">تفاصيل إضافية (علامة مميزة، الدور، ملاحظات للمندوب)</label><textarea class="field" id="ad"></textarea>
    <p class="err" id="err" role="alert"></p>
    <button class="send" id="send">ابعتي الطلب على واتساب</button>
    <button class="copy" id="copy" hidden>لو واتساب مفتحش: انسخي الطلب وابعتيه</button>
    <p class="note">هتفتح معاكي رسالة جاهزة على واتساب بكل تفاصيل الطلب، وبنكمل معاكي الدفع والتوصيل هناك.</p>
  </div>
</section>
<section class="sheet det" id="detail" role="dialog" aria-modal="true" aria-label="تفاصيل المنتج">
  <button class="close" id="closeDet" aria-label="إغلاق">×</button>
  <div id="dBody"></div>
</section>

var cat="all",term="",cart=[],cur=null,qty=1,curOpt=0,ready=true;
var $=function(i){return document.getElementById(i)};
function fmt(n){return n.toLocaleString("ar-EG")+" ج.م"}
function ar(n){return Number(n).toLocaleString("ar-EG")}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function latin(s){return String(s).replace(/[\u0660-\u0669]/g,function(d){return d.charCodeAt(0)-1632})}
function inCart(p){return cart.reduce(function(a,l){return a+(l.p.id===p.id?l.q:0)},0)}
function left(p){return p.stock==null?999:Math.max(0,p.stock-inCart(p))}
function byId(id){return P.filter(function(x){return x.id===id})[0]}

function drawCats(){
  $("cats").innerHTML=CATS.map(function(c){
    return '<button class="chip" data-c="'+c.id+'" aria-pressed="'+(c.id===cat)+'">'+c.n+'</button>'}).join("");
}
function drawGrid(){
  var g=$("grid"),e=$("empty");
  if(!ready){g.innerHTML='<div class="loading">جاري تحميل المنتجات...</div>';e.hidden=true;return}
  var list=P.filter(function(p){
    return (cat==="all"||p.cat===cat)&&(!term||(p.name+p.desc).toLowerCase().indexOf(term)>-1)});
  g.innerHTML=list.map(function(p){
    var out=p.stock===0, d=out?"":' data-open="'+p.id+'"';
    return '<article class="card"'+d+'><div class="pic"><img src="'+p.img+'" data-id="'+p.id+'" alt="'+esc(p.name)+'" loading="lazy"><span class="price">'+fmt(p.price)+'</span></div>'+
      '<h3 class="name">'+esc(p.name)+'</h3><p class="desc">'+esc(p.desc)+'</p>'+
      (p.stock>0&&p.stock<=3?'<p class="left">متبقي '+ar(p.stock)+' بس</p>':'')+
      '<button class="add"'+(out?' disabled':'')+'>'+(out?'خلص':'اختاري الكمية')+'</button></article>'}).join("");
  if(!list.length){
    e.hidden=false;
    e.innerHTML=term?"مفيش منتج بالاسم ده. جربي كلمة تانية.":
      'المنتجات في القسم ده جاية قريب. <br>اسألينا على واتساب وهنقولك على الموجود: <a href="https://wa.me/'+WA+'">ابعتي رسالة</a>';
  } else e.hidden=true;
}

/* detail */
function drawDetail(){
  var p=cur,max=left(p);
  if(qty>max)qty=Math.max(1,max);
  var o=p.opts?'<div class="dlabel">'+esc(p.optLabel||"الاختيار")+'</div><div class="opts" role="group">'+p.opts.map(function(x,i){
      return '<button class="opt" data-do="'+i+'" aria-pressed="'+(i===curOpt)+'">'+esc(x)+'</button>'}).join("")+'</div>':"";
  var av=p.stock==null?"":(max===0?'<p class="avail warn">وصلتي لآخر كمية متاحة من المنتج ده.</p>'
      :'<p class="avail'+(max<=3?' warn':'')+'">المتاح: '+ar(max)+'</p>');
  $("dBody").innerHTML='<div class="dpic"><img src="'+p.img+'" data-id="'+p.id+'" alt="'+esc(p.name)+'"></div>'+
    '<h2 class="dname">'+esc(p.name)+'</h2><p class="dprice">'+fmt(p.price)+'</p><p class="desc" style="margin:0">'+esc(p.desc)+'</p>'+o+
    '<div class="dlabel">الكمية</div><div class="stepper"><button data-qm aria-label="تقليل" '+(qty<=1?'disabled':'')+'>−</button><b>'+ar(qty)+'</b>'+
    '<button data-qp aria-label="زيادة" '+(qty>=max?'disabled':'')+'>+</button></div>'+av+
    '<button class="send" data-dadd style="background:var(--ink);color:var(--bg)" '+(max===0?'disabled':'')+'>أضيفي للسلة · '+fmt(p.price*qty)+'</button>';
}
function openDetail(id){
  cur=byId(id);if(!cur||cur.stock===0)return;
  curOpt=0;qty=1;drawDetail();show("detail",true);
}
function addToCart(){
  var p=cur,o=p.opts?p.opts[curOpt]:"",n=Math.min(qty,left(p));
  if(n<1)return;
  var f=cart.filter(function(l){return l.p.id===p.id&&l.o===o})[0];
  if(f)f.q+=n;else cart.push({p:p,o:o,q:n});
  show("detail",false);drawCart();show("sheet",true);drawGrid();
}

/* cart */
function count(){return cart.reduce(function(a,l){return a+l.q},0)}
function total(){return cart.reduce(function(a,l){return a+l.q*l.p.price},0)}
function drawCart(){
  $("cnt").textContent=ar(count());
  var has=cart.length>0;
  $("checkout").hidden=!has;
  $("lines").innerHTML=has?cart.map(function(l,i){
    return '<div class="line"><img src="'+l.p.img+'" data-id="'+l.p.id+'" alt=""><div class="t">'+esc(l.p.name)+
    (l.o?'<small>'+esc(l.p.optLabel||"الاختيار")+': '+esc(l.o)+'</small>':'')+'<small>'+fmt(l.p.price)+'</small></div>'+
    '<div class="qty"><button data-m="'+i+'" aria-label="تقليل">−</button><b>'+ar(l.q)+'</b><button data-pl="'+i+'" aria-label="زيادة"'+(left(l.p)<1?' disabled':'')+'>+</button></div></div>'}).join("")
    :'<p class="empty" style="padding:30px 0">السلة فاضية. اختاري منتج وأضيفيه.</p>';
  $("sum").textContent=fmt(total());
}
function show(id,on){
  $(id).classList.toggle("on",on);
  $("veil").classList.toggle("on",$("sheet").classList.contains("on")||$("detail").classList.contains("on"));
}
function closeAll(){show("sheet",false);show("detail",false)}

document.addEventListener("click",function(e){
  var t=e.target;
  var op=t.closest&&t.closest("[data-open]");
  if(t.dataset.c){cat=t.dataset.c;drawCats();drawGrid()}
  else if(t.dataset.do!==undefined){curOpt=+t.dataset.do;drawDetail()}
  else if(t.dataset.qm!==undefined){if(qty>1){qty--;drawDetail()}}
  else if(t.dataset.qp!==undefined){if(qty<left(cur)){qty++;drawDetail()}}
  else if(t.dataset.dadd!==undefined){addToCart()}
  else if(t.dataset.pl!==undefined){var L=cart[+t.dataset.pl];if(left(L.p)>0){L.q++;drawCart();drawGrid()}}
  else if(t.dataset.m!==undefined){var i=+t.dataset.m;cart[i].q--;if(cart[i].q<1)cart.splice(i,1);drawCart();drawGrid()}
  else if(op){openDetail(op.dataset.open)}
});
$("q").addEventListener("input",function(e){term=e.target.value.trim().toLowerCase();drawGrid()});
$("openCart").onclick=function(){show("sheet",true);$("closeCart").focus()};
$("closeCart").onclick=function(){show("sheet",false)};
$("closeDet").onclick=function(){show("detail",false)};
$("cont").onclick=function(){show("sheet",false)};
$("veil").onclick=closeAll;
document.addEventListener("keydown",function(e){if(e.key==="Escape")closeAll()});

/* checkout */
var FIELDS=[["nm","الاسم"],["ph","رقم الموبايل"],["gov","المحافظة"],["area","المنطقة"],["st","اسم الشارع"],["bld","رقم العمارة"],["apt","رقم الشقة"],["ad","التفاصيل الإضافية"]];
$("send").onclick=function(){
  var bad=[],first=null;
  FIELDS.forEach(function(f){
    var el=$(f[0]),v=el.value.trim(),ok=v!=="";
    if(f[0]==="ph"&&ok){ok=/^01[0125]\d{8}$/.test(latin(v).replace(/[\s-]/g,""))}
    el.setAttribute("aria-invalid",ok?"false":"true");
    if(!ok){bad.push(f[1]);if(!first)first=el}
  });
  if(bad.length){
    $("err").textContent=($("ph").getAttribute("aria-invalid")==="true"&&$("ph").value.trim()!==""?"رقم الموبايل لازم يبقى 11 رقم ويبدأ بـ 01. ":"")+
      "كملي الخانات دي: "+bad.join("، ")+".";
    first.focus();return}
  var over=cart.filter(function(l){return l.p.stock!=null&&inCart(l.p)>l.p.stock});
  if(over.length){$("err").textContent="الكمية المطلوبة من "+over[0].p.name+" أكتر من المتاح. عدّلي الكمية.";return}
  $("err").textContent="";
  var v=function(i){return latin($(i).value.trim())};
  var m="أهلًا Sheinbynada، عايزة أطلب:\n\n";
  cart.forEach(function(l,i){
    m+=(i+1)+") "+l.p.name+(l.o?" ("+l.o+")":"")+" × "+l.q+" = "+(l.q*l.p.price)+" ج.م\n"});
  m+="\nالإجمالي: "+total()+" ج.م (غير شامل الشحن)\n\nالاسم: "+v("nm")+"\nالموبايل: "+v("ph")+
     "\nالمحافظة: "+v("gov")+"\nالمنطقة: "+v("area")+"\nالشارع: "+v("st")+"\nرقم العمارة: "+v("bld")+"\nرقم الشقة: "+v("apt")+
     "\nتفاصيل إضافية: "+$("ad").value.trim();
  LASTMSG=m;$("copy").hidden=false;
  window.open("https://wa.me/"+WA+"?text="+encodeURIComponent(m),"_blank");
};
var LASTMSG="";
$("copy").onclick=function(){
  var b=$("copy");
  function ok(){b.textContent="اتنسخ. ابعتيه على واتساب 01157190028"}
  try{navigator.clipboard.writeText(LASTMSG).then(ok,function(){fb()})}catch(x){fb()}
  function fb(){var t=document.createElement("textarea");t.value=LASTMSG;document.body.appendChild(t);t.select();
    try{document.execCommand("copy");ok()}catch(y){b.textContent="انسخي الرسالة بإيدك"}document.body.removeChild(t)}
};

/* sheet */
var SHEET_URL="https://docs.google.com/spreadsheets/d/e/2PACX-1vRdzOZJbS6hVhV0mhuq6qk9hI-o5EoI40h_IfMipZctAcqSMxgo4VOH40LSPy5rwmWP5pGMAyzs1uZg/pub?output=csv";
var BASE=P.slice();
var CATMAP={};CATS.forEach(function(c){CATMAP[c.n]=c.id});
function parseCSV(s){var r=[],row=[],c="",q=false;
  for(var i=0;i<s.length;i++){var ch=s[i];
    if(q){if(ch==='"'){if(s[i+1]==='"'){c+='"';i++}else q=false}else c+=ch}
    else if(ch==='"')q=true;
    else if(ch===","){row.push(c);c=""}
    else if(ch==="\n"||ch==="\r"){if(ch==="\r"&&s[i+1]==="\n")i++;row.push(c);r.push(row);row=[];c=""}
    else c+=ch}
  if(c!==""||row.length){row.push(c);r.push(row)}return r}
function imgUrl(u,id){u=(u||"").trim();
  if(!u){var b=BASE.filter(function(x){return x.id===id})[0];return b?b.img:""}
  var m=u.match(/\/d\/([\w-]+)/)||u.match(/[?&]id=([\w-]+)/);
  return m?"https://drive.google.com/thumbnail?id="+m[1]+"&sz=w800":u}
function fromSheet(txt){
  var rows=parseCSV(txt).slice(1),out=[];
  rows.forEach(function(r,i){
    if(!r[2]||!r[2].trim())return;
    var av=(r[7]||"").trim().toLowerCase();
    if(av==="لا"||av==="no"||av==="0")return;
    var id=(r[0]||"").trim()||("s"+i);
    var o=(r[5]||"").split("|").map(function(x){return x.trim()}).filter(Boolean);
    var st=(r[8]||"").trim();
    out.push({id:id,cat:CATMAP[(r[1]||"").trim()]||"all",name:r[2].trim(),desc:(r[3]||"").trim(),
      price:parseFloat(latin(r[4]||"0"))||0,stock:st===""?null:(parseInt(latin(st),10)||0),
      opts:o.length?o:null,optLabel:"الاختيار",img:imgUrl(r[6],id)})});
  return out}
document.addEventListener("error",function(e){var im=e.target;if(im&&im.tagName==="IMG"&&im.dataset.id){
  var b=BASE.filter(function(x){return x.id===im.dataset.id})[0];
  if(b&&im.src!==b.img){im.src=b.img}else{im.style.visibility="hidden"}}},true);

drawCats();drawCart();
if(SHEET_URL){
  ready=false;drawGrid();
  var finished=false;
  function finish(l){if(finished)return;finished=true;if(l&&l.length){P=l}ready=true;drawGrid()}
  setTimeout(function(){finish(null)},6000);
  fetch(SHEET_URL).then(function(r){return r.text()}).then(function(txt){finish(fromSheet(txt))}).catch(function(){finish(null)});
}else drawGrid();
</script>
